name: CI / CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1 tesseract-ocr tesseract-ocr-eng

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: backend
          FLASK_DEBUG: "false"
          LLM_BACKEND: "fake"
        run: |
          pytest backend/tests/ -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Bundle
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build Validation (Compose & Render)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Stack
        run: |
          docker compose build

      - name: Validate Render Production All-in-One Dockerfile
        run: |
          docker build -t finsight:render -f Dockerfile .

  deploy-render:
    name: Trigger Render Deployment
    needs: [backend-test, frontend-build, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Check & Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "==> Triggering Render Deploy Hook..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "HTTP Status Code: $HTTP_CODE"
            echo "Response: $BODY"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo " Render deploy triggered successfully!"
            else
              echo "❌ Render deploy trigger failed with status $HTTP_CODE"
              exit 1
            fi
          else
            echo "ℹ️ Notice: RENDER_DEPLOY_HOOK_URL secret is not configured."
            echo "To enable automatic deployment on push, create a Deploy Hook in Render Service Settings"
            echo "and add it as 'RENDER_DEPLOY_HOOK_URL' in your GitHub Repository Secrets."
          fi

